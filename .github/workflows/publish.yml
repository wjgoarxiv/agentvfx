# Stages the package on npm when a GitHub release is published, using npm trusted publishing (OIDC), so each version
# carries provenance. A staged version goes live only after a maintainer approves it with 2FA on npmjs.com (Staged
# Packages tab) or with `npm stage approve`. The release tag must match package.json, e.g. v0.3.6.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm that supports staged publishing (11.15.0 or later)
        run: npm install -g npm@latest
      - name: Check the tag matches package.json
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "$GITHUB_REF_NAME"
          if npm view "agentvfx@$v" version >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Stage the version for approval
        if: steps.version.outputs.exists != 'true'
        run: npm stage publish --access public
      - name: Already on npm
        if: steps.version.outputs.exists == 'true'
        run: echo "This version is already on npm; nothing to stage."
